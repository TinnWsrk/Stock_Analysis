<!DOCTYPE html>
<html>
<head>
    <title>Main - Stock Analysis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #2e2e2e; /* Dark grey background */
        }
        .app-title {
            font-size: 3rem;
            text-align: center;
            margin-bottom: 20px;
        }
        .app-title .stock {
            color: #cc4b0f;
        }
        .app-title .analysis {
            color: #145bc7;
        }
    </style>
</head>

<body class="p-5">
    <div class="app-title">
        <span class="stock">Stock</span> <span class="analysis">Analysis</span>
    </div>

    <h1>📈 Stock Data Visualizer</h1>

    {% if user_email %}
    <div class="alert alert-success mb-4">
        Welcome, {{ user_email }}! You are logged in.
    </div>
    {% endif %}

    <div class="card shadow p-4 mb-4">
        <h4 class="mb-3">Upload your CSV file</h4>
        <form method="POST" enctype="multipart/form-data">
            <input type="file" name="csvfile" class="form-control mb-3" required>
            <button type="submit" class="btn btn-primary">Upload & Visualize</button>
        </form>
    </div>


    {% if graph_html %}
    <div class="card p-4 shadow">
        <h5 class="mb-3">📊 Chart Preview</h5>
        {{ graph_html | safe }}
    </div>
    {% endif %}

</body>
</html>
