<!DOCTYPE html>
<html>
<head>
    <title>Stock Analysis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-5 bg-light">
    <div class="container">
        <h1 class="mb-4">📈 Stock Data Visualizer</h1>

        <!-- 🔁 Neues Formular: Ticker statt Datei -->
        <form method="POST" class="mb-4">
            <label for="ticker" class="form-label">Ticker-Symbol (z. B. AAPL, TSLA):</label>
            <input type="text" name="ticker" id="ticker" class="form-control mb-2" required placeholder="z. B. AAPL">
            <button type="submit" class="btn btn-primary">Abrufen</button>
        </form>

        {% if graph_html %}
        <div class="card p-3 shadow">
            {{ graph_html | safe }}
        </div>
        {% endif %}
    </div>
</body>
</html>
